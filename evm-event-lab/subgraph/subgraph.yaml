specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: EventStore
    network: sepolia
    source:
      address: "0x275Bb3520c05eaed91c552c8FDceE09aA43a5775"
      abi: EventStore
      startBlock: 11507193
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DataWritten
      abis:
        - name: EventStore
          file: ./abis/EventStore.json
      eventHandlers:
        - event: DataWritten(indexed address,indexed bytes32,string,string,uint256)
          handler: handleDataWritten
      file: ./src/mapping.ts
