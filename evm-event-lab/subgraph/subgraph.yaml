specVersion: 1.3.0
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: EventStore
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: EventStore
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - DataWritten
      abis:
        - name: EventStore
          file: ./abis/EventStore.json
      eventHandlers:
        - event: DataWritten(indexed address,indexed bytes32,string,string,uint256)
          handler: handleDataWritten
      file: ./src/mapping.ts
